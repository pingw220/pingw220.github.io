<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Ping Wang · Admin</title>
  </head>
  <body>
    <!-- Sveltia CMS: edits the site's content in the GitHub repo. Config: ./config.yml -->
    <script src="https://unpkg.com/@sveltia/cms@0.221.8/dist/sveltia-cms.js"></script>
    <script>
      // Editor blocks for media in posts. They write plain Markdown, which the site turns
      // into players at build time (src/lib/rehype-media.mjs):
      //   ![Caption](/media/uploads/file.mp3)  → audio player
      //   ![Caption](/media/uploads/file.mp4)  → video player
      //   a YouTube link on its own line       → embedded video
      const AUDIO = 'mp3|wav|ogg|oga|m4a|flac|aac';
      const VIDEO = 'mp4|webm|mov|m4v';
      const escapeAttr = (s) => String(s ?? '').replace(/"/g, '&quot;');

      const mediaComponent = (id, label, exts, tag) => ({
        id,
        label,
        fields: [
          { name: 'src', label: `${label} file`, widget: 'file' },
          { name: 'caption', label: 'Caption', widget: 'string', required: false },
        ],
        pattern: new RegExp(`^!\\[([^\\]]*)\\]\\((\\S+\\.(?:${exts}))\\)$`, 'm'),
        fromBlock: (m) => ({ caption: m[1], src: m[2] }),
        toBlock: (d) => `![${d.caption || ''}](${d.src || ''})`,
        toPreview: (d) => `<${tag} controls src="${escapeAttr(d.src)}" style="width:100%"></${tag}>`,
      });

      CMS.registerEditorComponent(mediaComponent('audio', 'Audio', AUDIO, 'audio'));
      CMS.registerEditorComponent(mediaComponent('video', 'Video', VIDEO, 'video'));
      CMS.registerEditorComponent({
        id: 'youtube',
        label: 'YouTube',
        fields: [{ name: 'url', label: 'YouTube link', widget: 'string' }],
        pattern: /^(https:\/\/(?:www\.)?(?:youtube\.com|youtu\.be)\/\S+)$/m,
        fromBlock: (m) => ({ url: m[1] }),
        toBlock: (d) => d.url || '',
        toPreview: (d) => `<p>▶ YouTube: ${escapeAttr(d.url)}</p>`,
      });
    </script>
  </body>
</html>
